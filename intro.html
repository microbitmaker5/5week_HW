<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>김덕일 자기소개</title>
<style>
body{font-family:"Malgun Gothic",Arial,sans-serif;text-align:center;padding:20px;color:#333;line-height:1.7;}
img{width:220px;border-radius:10px;margin-bottom:15px;}
h2{color:#4a90e2;}
.box{text-align:left;background:#f7f9fc;border-left:5px solid #4a90e2;padding:15px;margin:15px 0;border-radius:5px;}
strong{color:#2d6da3;}
</style>
</head>
<body>
<img src="일러스트_김덕일.png" alt="김덕일 일러스트">
<h2>안녕하세요. 김덕일입니다.</h2>
<div class="box">퇴직 후 초·중·고등학교에서 <strong>디지털 관련 시간강사</strong>로 수업을 하고 있습니다.</div>
<div class="box">컴퓨터공학과 관련하여 부족한 점이 많아 관련 수업을 이수하면서 전공지식을 쌓고 <strong>졸업증을 받는 것</strong>을 목표로 공부하고 있습니다.</div>
<div class="box">이번에 <strong>정보처리기사</strong>를 취득했고, 현재 <strong>빅데이터분석기사</strong>를 준비하고 있습니다.</div>
</body>
</html>
